# Sobreposição pt do GestPro (ADR-0012 §8, revisto nas Consequências).
# O pacote `pt` do Keycloak 26.7.0 JÁ é português europeu (palavra-passe,
# utilizador) — verificado no jar org.keycloak.keycloak-themes-26.7.0.jar.
# O que este ficheiro cobre é só ORTOGRAFIA (o produto escreve pré-AO:
# actualizar, desactivada, contactar) e vocabulário nosso, nas cadeias do
# login, da verificação de e-mail e da definição de palavra-passe.
# NOTA: o ADR nomeia `messages_pt_PT.properties`; o locale do realm é `pt`
# (defaultLocale correcto por decisão), pelo que a sobreposição eficaz para
# esse locale tem de se chamar `messages_pt.properties` — regra de resolução
# de ResourceBundle do Java. Registado no handoff do w8-identidade.

