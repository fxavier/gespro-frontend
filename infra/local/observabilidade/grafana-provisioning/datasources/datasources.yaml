# Grafana Datasource Provisioning — GestPro ERP
# Montado em /etc/grafana/provisioning/datasources/ no contentor otel-lgtm.
# As datasources já existem no otel-lgtm com UIDs fixos; este ficheiro
# confirma a configuração explicitamente para o aprovisionamento de dashboards.
#
# Nota: o otel-lgtm já configura Prometheus, Loki e Tempo internamente.
# Este ficheiro existe para garantir que os UIDs e nomes são estáveis,
# necessário para os dashboards provisionados funcionarem.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    jsonData:
      timeInterval: "15s"
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://localhost:3100
    jsonData:
      derivedFields:
        - matcherRegex: '"traceId":"([^"]+)"'
          name: traceId
          url: '$${__value.raw}'
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://localhost:3200
    jsonData:
      serviceMap:
        datasourceUid: prometheus
      search:
        hide: false
      nodeGraph:
        enabled: true
      tracesToLogs:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: true
