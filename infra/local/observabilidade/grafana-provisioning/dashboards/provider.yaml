# Grafana Dashboard Provisioning — GestPro ERP
# Montado em /etc/grafana/provisioning/dashboards/ no contentor otel-lgtm.
# Os ficheiros JSON ficam em /var/lib/grafana/dashboards/gespro/
# (montagem configurada pelo w8-plataforma-local no docker-compose.yml).
#
# Documentação: https://grafana.com/docs/grafana/latest/administration/provisioning/#dashboards
apiVersion: 1

providers:
  - name: "GestPro ERP"
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/gespro
      foldersFromFilesStructure: false
    folder: "GestPro"
    folderUid: "gespro"
