# Grafana Dashboard Provisioning — GestPro ERP
# Montado em /otel-lgtm/grafana/conf/provisioning/dashboards/ no contentor otel-lgtm.
# Os ficheiros JSON estão na mesma pasta (montagem única — contrato w8-plataforma-local §3).
#
# Documentação: https://grafana.com/docs/grafana/latest/administration/provisioning/#dashboards
apiVersion: 1

providers:
  - name: "GestPro ERP"
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /otel-lgtm/grafana/conf/provisioning/dashboards
      foldersFromFilesStructure: false
    folder: "GestPro"
    folderUid: "gespro"
