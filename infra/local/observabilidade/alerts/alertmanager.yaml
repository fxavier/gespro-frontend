# Configuração de Alerting (Contact Points + Notification Policies) — GestPro ERP (ambiente local)
# Formato: Grafana Unified Alerting provisioning (apiVersion: 1)
# Montado em /otel-lgtm/grafana/conf/provisioning/alerting/ no contentor otel-lgtm.
#
# DESTINO LOCAL (ADR-0019 §Consequências · ADR-0026 §3):
#   Em ambiente local, os alertas vão para o receptor de webhook HTTP do compose
#   (serviço webhook-receptor, porta 8080 interna / 8082 no host).
#   Inspecção: docker logs -f gespro-webhook-receptor  OU  http://localhost:8082
#
# DESTINO DE PRODUÇÃO (a configurar quando houver fornecedor):
#   Mudar ALERTMANAGER_WEBHOOK_URL no ambiente — não código.
#   O destino humano (e-mail, canal de mensagens) é configurado quando houver produção.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: "webhook-local"
    receivers:
      - uid: "webhook-local-receiver"
        type: webhook
        settings:
          url: "http://webhook-receptor:8080/alertas"
          httpMethod: POST
          maxAlerts: 0
        disableResolveMessage: false

  - orgId: 1
    name: "webhook-local-criticos"
    receivers:
      - uid: "webhook-local-criticos-receiver"
        type: webhook
        settings:
          url: "http://webhook-receptor:8080/alertas/criticos"
          httpMethod: POST
          maxAlerts: 0
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: webhook-local
    group_by: ["alertname", "severity"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: "webhook-local-criticos"
        matchers:
          - "severity = critical"
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 30m
      - receiver: "webhook-local"
        matchers:
          - "severity = warning"
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 6h
