# Dependabot (#553) — actualizações de segurança e de versão, semanais.
# O npm cobre o workspace pnpm inteiro a partir da raiz (pnpm-lock.yaml único).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /
      - /apps/site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
