# Postgres 17 para desenvolvimento local (spec 01 task 1).
# Subir: docker compose up -d   |  Aplicar schema: pnpm db:migrate:dev
services:
  db:
    image: postgres:17-alpine
    container_name: gespro-db
    environment:
      POSTGRES_USER: gespro
      POSTGRES_PASSWORD: gespro
      POSTGRES_DB: gespro
    ports:
      - "5432:5432"
    volumes:
      - gespro-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gespro -d gespro"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  gespro-pgdata:
